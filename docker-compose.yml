services:
  api:
    build:
      context: .
      args:
        PYTHON_VERSION: "3.12"
    image: encurtador-url:latest
    container_name: encurtador-url
    ports:
      - "8000:8000"
    environment:
      BASE_URL: http://localhost:8000
      DATABASE_PATH: /app/data/links.db
    volumes:
      - dados:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dados:
