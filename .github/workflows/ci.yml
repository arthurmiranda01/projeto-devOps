name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Qualidade de codigo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configura o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instala as dependencias
        run: pip install -r requirements-dev.txt

      - name: Verifica o lint
        run: ruff check --output-format=github .

      - name: Verifica a formatacao
        run: ruff format --check .

  testes:
    name: Testes
    runs-on: ubuntu-latest
    needs: qualidade
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Configura o Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instala as dependencias
        run: pip install -r requirements-dev.txt

      - name: Roda os testes com cobertura
        run: pytest

      - name: Guarda o relatorio de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  imagem:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: testes

    steps:
      - uses: actions/checkout@v4

      - name: Constroi a imagem
        run: docker build -t encurtador-url:${{ github.sha }} .

      - name: Sobe o container e verifica o health
        run: |
          docker run -d --name encurtador -p 8000:8000 encurtador-url:${{ github.sha }}
          for tentativa in $(seq 1 10); do
            if curl -fs http://localhost:8000/health; then
              echo "API respondeu"
              exit 0
            fi
            sleep 3
          done
          docker logs encurtador
          exit 1

      - name: Testa o fluxo de encurtamento
        run: |
          codigo=$(curl -fs -X POST http://localhost:8000/links \
            -H "Content-Type: application/json" \
            -d '{"url": "https://pucpr.br", "codigo": "pucpr"}' | grep -o '"codigo":"[^"]*"')
          echo "criado: $codigo"
          curl -fs -o /dev/null -w "%{http_code}\n" http://localhost:8000/pucpr | grep -q 307

      - name: Remove o container
        if: always()
        run: docker rm -f encurtador
